resources:
  myApiGateway:
    type: http-api-gateway

  myLambda:
    type: function
    properties:
      events:
        - type: http-api-gateway
          properties:
            httpApiGatewayName: myApiGateway
            method: "*"
            path: /{proxy+}
      packaging:
        type: stacktape-lambda-buildpack
        properties:
          entryfilePath: packages/lambda/src/index.ts
