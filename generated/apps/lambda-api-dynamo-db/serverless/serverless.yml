service: lambda-api-dynamo-db

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-west-1
  memorySize: 512
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource: !GetAtt PostsTable.Arn

functions:
  api:
    handler: src/index.handler
    environment:
      STP_POSTS_TABLE_NAME: !Ref PostsTable
    events:
      - httpApi: '*'

resources:
  Resources:
    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
