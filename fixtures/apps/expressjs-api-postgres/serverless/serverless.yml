service: expressjs-api-postgres

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-west-1
  memorySize: 512
  httpApi:
    cors: true
  environment:
    # The database lives outside the service; its URL comes from the environment (Serverless loads `.env`).
    STP_MAIN_DATABASE_CONNECTION_STRING: ${env:DATABASE_URL}

functions:
  api:
    handler: src/index.handler
    events:
      - httpApi: '*'

package:
  patterns:
    # The bundled Prisma client loads its query engine from the package at run time.
    - 'node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node'
    - 'node_modules/.prisma/client/schema.prisma'
